<?xml version="1.0" encoding="UTF-8"?>
<!-- Two earbuds, tilted apart. Drawn on the 16px symbolic grid: at panel size a
     single bud and stem collapses into a comma, while two stems stay legible. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#2e3436">
    <g transform="rotate(-11 4.2 8)">
      <ellipse cx="4.2" cy="5" rx="2.9" ry="2.7"/>
      <rect x="2.9" y="4.2" width="2.6" height="9.3" rx="1.3"/>
    </g>
    <g transform="rotate(11 11.8 8)">
      <ellipse cx="11.8" cy="5" rx="2.9" ry="2.7"/>
      <rect x="10.5" y="4.2" width="2.6" height="9.3" rx="1.3"/>
    </g>
  </g>
</svg>
