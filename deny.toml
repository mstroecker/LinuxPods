# cargo-deny: advisories, licenses, banned crates and allowed sources.
# Run with `make deny`; CI runs the same checks.

[graph]
# LinuxPods only runs on Linux, so Windows and macOS dependencies are not judged
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Judge the crates optional features pull in too - the harness feature's, say.
# Releases never enable them, but they still build on CI and developer machines.
all-features = true

[advisories]
# RustSec advisories: vulnerabilities, unmaintained crates and yanked versions fail
yanked = "deny"
# zbus 6 absorbed these crates, but ksni (the tray) still needs zbus 5, which pulls
# them in. Drop these once ksni moves to zbus 6: https://github.com/iovxw/ksni/issues/44
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant is part of zbus 6; ksni still needs zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is part of zbus 6; ksni still needs zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is part of zbus 6; ksni still needs zbus 5" },
]

[licenses]
# Every license here is compatible with GPL-3.0-or-later
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "GPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Older majors still used upstream. Once their users move on, cargo-deny reports
# the entry as an unmatched skip and it can go.
skip = [
    { crate = "syn@2", reason = "enumflags2_derive, num-derive, strum_macros and tracing-attributes are still on syn 2" },
    { crate = "system-deps@7", reason = "libadwaita-sys is still on system-deps 7; the other GTK -sys crates use 9" },
]

[sources]
# crates.io only: a git or third-party registry dependency has to be added here first
unknown-registry = "deny"
unknown-git = "deny"
