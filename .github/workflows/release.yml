# Publishes a GitHub release for a pushed v* tag. The release process is in
# docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at a commit that is not on main"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref_name }}

  build:
    needs: verify
    permissions:
      contents: read
      id-token: write # passed on to the attest job
      attestations: write # passed on to the attest job
    uses: $/.github/workflows/release-build.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  publish:
    name: Publish
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # The release notes are this version's section of CHANGELOG.md
      - run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
      # Created as a draft and published once every file is attached, so an
      # immutable release never goes out incomplete
      - run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "LinuxPods $VERSION" --notes-file notes.md dist/*
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
