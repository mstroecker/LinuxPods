# publish_results makes api.scorecard.dev reject results from a workflow with
# top-level env or defaults, workflow-level write permissions, or actions outside
# its approved list: https://github.com/ossf/scorecard-action#workflow-restrictions
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checks the code and workflows
      issues: read # checks issue activity (Maintained)
      pull-requests: read # checks code review (Code-Review)
      checks: read # checks CI runs (CI-Tests)
      security-events: write # uploads the results to code scanning
      id-token: write # publishes the results to api.scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
