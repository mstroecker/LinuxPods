[package]
name = "linuxpods"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[lib]
name = "linuxpods"
path = "src/lib.rs"

[[bin]]
name = "linuxpods"
path = "src/main.rs"

[dependencies]
# UI
gtk = { package = "gtk4", version = "0.11", features = ["v4_4"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }

# Async runtime + plumbing
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
async-channel = "2"
futures-util = "0.3"

# Bluetooth: L2CAP sockets only - no D-Bus stack pulled in (see default-features)
bluer = { version = "0.17", default-features = false, features = ["l2cap"] }

# D-Bus: BlueZ scanning + BatteryProvider1
zbus = { version = "5", default-features = false, features = ["tokio"] }

# System tray (StatusNotifierItem)
ksni = "0.3"

# Crypto + storage
aes = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
dirs = "7"

# Diagnostics
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
tempfile = "3"
